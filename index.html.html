<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Life Lines | 人生の幸福度チャート</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#eaf0ff;background:#0d1325}*{box-sizing:border-box}body{margin:0}header{padding:24px max(18px,calc((100vw - 1100px)/2));background:#151e35;border-bottom:1px solid #33415c}h1{margin:0;font-size:29px}p{color:#acbad4}main{max-width:1100px;margin:auto;padding:20px;display:grid;grid-template-columns:320px 1fr;gap:18px}.panel{background:#19243d;border:1px solid #344361;border-radius:18px;padding:20px;margin-bottom:18px}h2{margin:0 0 15px;font-size:19px}label{display:block;font-size:13px;color:#bdcae1;margin:13px 0 5px}input,select,textarea,button{font:inherit}input:not([type=range]):not([type=checkbox]),select,textarea{width:100%;background:#10192d;border:1px solid #475675;border-radius:10px;padding:10px;color:white}textarea{min-height:70px;resize:vertical}button{border:0;border-radius:11px;padding:11px 14px;background:#6b91fa;color:#07142e;font-weight:750;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.ghost{background:#334362;color:#e8f0ff}.danger{background:#63384c;color:#fff}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row>*{flex:1}.tiny{font-size:12px;color:#aebcda}.pill{padding:5px 9px;border-radius:20px;background:#334461;font-size:12px}.person{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #33415c}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:8px}.chart{width:100%;height:auto;display:block;background:#10192c;border-radius:12px}#chartPanel{min-height:420px}.hidden{display:none!important}#scoreNum{font-size:28px;font-weight:800}input[type=range]{width:100%}.note{background:#263753;padding:10px;border-radius:10px;font-size:13px;color:#d5e2ff}.events{max-height:260px;overflow:auto}.eventItem{border-bottom:1px solid #33415c;padding:8px 0;font-size:13px}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar button{flex:1}.center{text-align:center}@media(max-width:760px){main{grid-template-columns:1fr;padding:12px}header{padding:18px}#chartPanel{min-height:0}} @media(max-width:760px){button{min-height:48px;touch-action:manipulation}input,select,textarea{font-size:16px!important} .panel{padding:15px} .person{gap:6px} .person button{min-width:65px} #chart{min-width:620px} .chartScroll{overflow-x:auto;-webkit-overflow-scrolling:touch} .toolbar button{min-width:120px} } </style></head><body><noscript><div style="background:#ffdddd;color:#650000;padding:18px;font-weight:bold">JavaScriptが無効なプレビューでは操作できません。HTMLファイルを保存し、SafariまたはChromeで開いてください。</div></noscript>
<header><h1>✦ Life Lines</h1><p style="margin:5px 0 0">人生の幸福度を、みんなで描こう。データはこの端末のブラウザ内だけに保存されます。</p></header>
<div id="storageWarning" class="note hidden" style="margin:12px"></div><main><aside><section class="panel"><h2>参加者</h2><div id="people"></div><label>名前を追加</label><div class="row"><input id="newName" placeholder="名前・ニックネーム" maxlength="24"><button id="addPerson" style="flex:0 0 auto">追加</button></div><p class="tiny">端末を順番に回して入力してね。GOまでは他の人の曲線は表示しません。</p></section><section class="panel" id="entryPanel"><h2 id="entryTitle">入力する人を選んでね</h2><div id="entryForm" class="hidden"><label>時期</label><select id="period"></select><label>幸福度 <span id="scoreNum">+0</span></label><input id="score" type="range" min="-100" max="100" step="1" value="0"><div class="topline tiny"><span>−100 とても不幸</span><span>0</span><span>+100 とても幸せ</span></div><label>そのとき起きたこと（任意）</label><textarea id="memo" placeholder="例：部活で最高の友達ができた"></textarea><label><input id="memoPublic" type="checkbox" checked> GO後に出来事も公開する</label><div class="toolbar" style="margin-top:13px"><button id="savePoint">この時期を保存</button><button class="ghost" id="ready">準備完了</button></div><p class="tiny" id="savedInfo"></p></div></section></aside>
<div><section class="panel" id="chartPanel"><div class="topline"><h2 id="chartTitle">あなたの幸福度チャート</h2><span class="pill" id="status">入力モード</span></div><div class="chartScroll"><svg id="chart" class="chart" viewBox="0 0 900 460" role="img" aria-label="幸福度チャート"></svg></div><p class="tiny">縦軸：幸福度（−100〜+100）／横軸：学年・年齢。線は点をなめらかにつなぎます。</p><div class="toolbar"><button id="go">GO！ 全員一斉公開</button><button id="png" class="ghost">PNG保存</button><button id="replay" class="ghost hidden">もう一度再生</button><button id="back" class="ghost hidden">入力画面に戻る</button></div><p class="note" id="guide">左の「参加者」から名前を追加して、順番に入力してね。</p></section><section class="panel"><div class="topline"><h2>出来事</h2><label style="margin:0"><input type="checkbox" id="showEvents" checked> 表示</label></div><div id="events" class="events tiny">GO後に公開された出来事が表示されます。</div></section><section class="panel"><h2>データ管理</h2><div class="toolbar"><button class="ghost" id="export">JSON保存</button><button class="ghost" id="importBtn">JSON読み込み</button><button class="danger" id="reset">全データ削除</button></div><input type="file" id="importFile" accept=".json,application/json" class="hidden"><p class="tiny">同じブラウザなら入力内容が残ります。大事なデータはJSONでバックアップしてね。</p></section></div></main>
<script>
(()=>{'use strict';const KEY='life-lines-offline-v1',colors=['#ff7f9c','#69b9ff','#ffd166','#a7e887','#c6a1ff','#ffae70','#64ded3','#ef8bde','#f5e47a','#9faeff'];const periods=[];for(let g=1;g<=6;g++)periods.push({id:'e'+g,label:'小'+g,x:6+g-1});for(let g=1;g<=3;g++)for(let h=1;h<=2;h++)periods.push({id:'m'+g+'-'+h,label:'中'+g+(h===1?' 前半':' 後半'),x:12+(g-1)+(h-1)/2});for(let g=1;g<=3;g++)for(let h=1;h<=3;h++)periods.push({id:'h'+g+'-'+h,label:'高'+g+' '+h+'期',x:15+(g-1)+(h-1)/3});for(let y=1;y<=12;y++)for(let q=1;q<=4;q++)periods.push({id:'u'+y+'-'+q,label:(y<=4?'大'+y:y<=6?'大卒後'+(y-4)+'年':'大卒後'+(y-4)+'年')+' '+q+'期',x:18+y-1+(q-1)/4});const $=id=>document.getElementById(id);let data,active=null,revealed=false,animation=1,raf=null;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data||!Array.isArray(data.people))data={people:[]};const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){$('storageWarning').textContent='この開き方では自動保存できません。Safari/Chromeで開くかJSON保存を使ってください。';$('storageWarning').classList.remove('hidden')}};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('period').innerHTML=periods.map(p=>`<option value="${p.id}">${p.label}</option>`).join('');const getPerson=()=>data.people.find(p=>p.id===active);const getPoints=p=>periods.filter(t=>p.points&&p.points[t.id]!==undefined).map(t=>({...t,...p.points[t.id]}));function peopleRender(){$('people').innerHTML=data.people.map(p=>`<div class="person"><span><i class="dot" style="background:${p.color}"></i>${esc(p.name)} <span class="tiny">${Object.keys(p.points||{}).length}点</span></span><span><span class="pill">${p.ready?'準備OK':'入力中'}</span> <button class="ghost" data-id="${p.id}" ${revealed?'disabled':''}>選択</button></span></div>`).join('');$('people').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>select(b.dataset.id));$('go').disabled=data.people.length===0||!data.people.every(p=>p.ready);$('guide').textContent=revealed?'線や点をタップすると出来事を確認できます。':data.people.length===0?'まず参加者を追加してね。':`準備完了：${data.people.filter(p=>p.ready).length}/${data.people.length}人。全員が準備完了するとGOを押せます。`}
function select(id){active=id;const p=getPerson();if(!p)return;$('entryForm').classList.remove('hidden');$('entryTitle').textContent=p.name+' の入力';$('period').value=periods[0].id;loadPoint();peopleRender();draw()};function loadPoint(){const p=getPerson();if(!p)return;const point=p.points[$('period').value]||{score:0,memo:'',public:true};$('score').value=point.score;$('memo').value=point.memo||'';$('memoPublic').checked=point.public!==false;scoreRender();$('savedInfo').textContent=`保存済み ${Object.keys(p.points).length} 点。時期を選ぶと入力内容を編集できます。`};function scoreRender(){$('scoreNum').textContent=(+$('score').value>0?'+':'')+$('score').value};$('score').oninput=scoreRender;$('period').onchange=loadPoint;$('addPerson').onclick=()=>{let name=$('newName').value.trim();if(!name)return alert('名前を入力してね');if(data.people.length>=12)return alert('最大12人までです');const id='p'+Date.now()+Math.random().toString(36).slice(2,7);data.people.push({id,name,color:colors[data.people.length%colors.length],ready:false,points:{}});$('newName').value='';persist();select(id)};$('newName').onkeydown=e=>{if(e.key==='Enter')$('addPerson').click()};$('savePoint').onclick=()=>{const p=getPerson();if(!p)return;p.points[$('period').value]={score:+$('score').value,memo:$('memo').value.slice(0,500),public:$('memoPublic').checked};p.ready=false;persist();loadPoint();peopleRender();draw()};$('ready').onclick=()=>{const p=getPerson();if(!p)return;if(!Object.keys(p.points).length)return alert('最低1点入力してね');p.ready=true;persist();active=null;$('entryForm').classList.add('hidden');$('entryTitle').textContent='次の人に端末を渡してね';peopleRender();draw()};
const NS='http://www.w3.org/2000/svg';function node(tag,attrs,parent,text){let e=document.createElementNS(NS,tag);Object.entries(attrs||{}).forEach(([k,v])=>e.setAttribute(k,v));if(text!==undefined)e.textContent=text;(parent||$('chart')).appendChild(e);return e};const X=x=>62+(x-6)/24*804,Y=y=>230-y*1.85;
// Shape-preserving cubic Hermite interpolation: no artificial overshoot between samples.
function smoothPath(pts){if(!pts.length)return '';const a=pts.map(t=>({x:X(t.x),y:Y(t.score)}));if(a.length===1)return `M${a[0].x},${a[0].y}`;const sec=a.slice(1).map((p,i)=>(p.y-a[i].y)/(p.x-a[i].x));const m=a.map((p,i)=>{if(i===0)return sec[0];if(i===a.length-1)return sec[sec.length-1];if(sec[i-1]*sec[i]<=0)return 0;const h0=a[i].x-a[i-1].x,h1=a[i+1].x-a[i].x,w1=2*h1+h0,w2=h1+2*h0;return (w1+w2)/(w1/sec[i-1]+w2/sec[i])});let d=`M${a[0].x.toFixed(2)},${a[0].y.toFixed(2)}`;for(let i=0;i<a.length-1;i++){const h=a[i+1].x-a[i].x;d+=` C${(a[i].x+h/3).toFixed(2)},${(a[i].y+m[i]*h/3).toFixed(2)} ${(a[i+1].x-h/3).toFixed(2)},${(a[i+1].y-m[i+1]*h/3).toFixed(2)} ${a[i+1].x.toFixed(2)},${a[i+1].y.toFixed(2)}`}return d}
function draw(){const svg=$('chart');svg.replaceChildren();node('rect',{x:0,y:0,width:900,height:460,fill:'#10192c'});for(let v=-100;v<=100;v+=25){node('line',{x1:62,x2:866,y1:Y(v),y2:Y(v),stroke:v===0?'#a8b8d4':'#35425c','stroke-width':v===0?2:1});node('text',{x:51,y:Y(v)+4,fill:'#aab8d4','font-size':13,'text-anchor':'end'},svg,v>0?'+'+v:v)}[6,9,12,15,18,22,26,30].forEach(x=>{node('line',{x1:X(x),x2:X(x),y1:45,y2:415,stroke:'#283852','stroke-dasharray':'3 5'});node('text',{x:X(x),y:440,fill:'#aab8d4','font-size':12,'text-anchor':'middle'},svg,x===6?'小1':x===9?'小4':x===12?'中1':x===15?'高1':x===18?'大1':x===22?'大卒後1年':x===26?'大卒後5年':'大卒後9年')});let shown=revealed?data.people:(getPerson()?[getPerson()]:[]);shown.forEach(p=>{let points=getPoints(p);if(!points.length)return;const visible=points.filter(t=>!revealed||t.x<=6+(30-6)*animation);if(!visible.length)return;const d=smoothPath(points);const clipId='clip-'+data.people.indexOf(p);const defs=node('defs',{},svg);const cp=node('clipPath',{id:clipId},defs);node('rect',{x:60,y:35,width:revealed?Math.max(0,X(6+24*animation)-60):810,height:390},cp);node('path',{d,fill:'none',stroke:p.color,'stroke-width':3.5,'stroke-linecap':'round','stroke-linejoin':'round','clip-path':`url(#${clipId})`});visible.forEach(t=>{let c=node('circle',{cx:X(t.x),cy:Y(t.score),r:5,fill:p.color,stroke:'#10192c','stroke-width':2,style:'cursor:pointer'});c.addEventListener('click',()=>{if(t.memo&&(!revealed||t.public))alert(p.name+' · '+t.label+'\n幸福度：'+t.score+'\n'+t.memo);else alert(p.name+' · '+t.label+'\n幸福度：'+t.score)})})});$('chartTitle').textContent=revealed?'みんなの幸福度チャート':getPerson()?getPerson().name+' の幸福度チャート':'あなたの幸福度チャート';$('status').textContent=revealed?'公開中':'入力モード';eventsRender()};function eventsRender(){if(!revealed){$('events').textContent='GO後に公開された出来事が表示されます。';return}if(!$('showEvents').checked){$('events').textContent='出来事は非表示です。';return}const list=data.people.flatMap(p=>getPoints(p).filter(t=>t.memo&&t.public&&t.x<=6+24*animation).map(t=>({...t,name:p.name,color:p.color}))).sort((a,b)=>a.x-b.x);$('events').innerHTML=list.length?list.map(t=>`<div class="eventItem"><i class="dot" style="background:${t.color}"></i><b>${esc(t.name)}</b> · ${esc(t.label)} · ${t.score>0?'+':''}${t.score}<div>${esc(t.memo)}</div></div>`).join(''):'公開された出来事はありません。'}$('showEvents').onchange=eventsRender;
function play(){cancelAnimationFrame(raf);revealed=true;animation=0;$('entryPanel').classList.add('hidden');$('go').classList.add('hidden');$('replay').classList.remove('hidden');$('back').classList.remove('hidden');peopleRender();const start=performance.now();function frame(now){animation=Math.min(1,(now-start)/8500);draw();if(animation<1)raf=requestAnimationFrame(frame)}raf=requestAnimationFrame(frame)}$('go').onclick=play;$('replay').onclick=play;$('back').onclick=()=>{cancelAnimationFrame(raf);revealed=false;animation=1;active=null;$('entryPanel').classList.remove('hidden');$('entryForm').classList.add('hidden');$('entryTitle').textContent='入力する人を選んでね';$('go').classList.remove('hidden');$('replay').classList.add('hidden');$('back').classList.add('hidden');peopleRender();draw()};$('png').onclick=()=>{try{const source=$('chart').cloneNode(true);source.setAttribute('xmlns',NS);source.setAttribute('width','1800');source.setAttribute('height','920');source.setAttribute('viewBox','0 0 900 460');const legend=node('g',{},source);const shown=revealed?data.people:(getPerson()?[getPerson()]:[]);shown.forEach((p,i)=>{const x=75+(i%4)*205,y=18+Math.floor(i/4)*17;node('circle',{cx:x,cy:y,r:5,fill:p.color},legend);node('text',{x:x+10,y:y+4,fill:'#ffffff','font-size':12},legend,p.name)});const xml=new XMLSerializer().serializeToString(source);const blob=new Blob([xml],{type:'image/svg+xml;charset=utf-8'});const url=URL.createObjectURL(blob);const img=new Image();img.onload=()=>{const canvas=document.createElement('canvas');canvas.width=1800;canvas.height=920;const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,1800,920);URL.revokeObjectURL(url);canvas.toBlob(png=>{if(!png){alert('PNGの生成に失敗しました');return}const pngUrl=URL.createObjectURL(png),a=document.createElement('a');a.href=pngUrl;a.download='life-lines-chart.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(pngUrl),10000)},'image/png')};img.onerror=()=>{URL.revokeObjectURL(url);alert('画像の生成に失敗しました')};img.src=url}catch(e){alert('PNG保存エラー：'+e.message)}};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='life-lines-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const parsed=JSON.parse(await f.text());if(!Array.isArray(parsed.people))throw Error('形式が違います');if(!confirm('現在のデータを読み込んだデータで置き換えますか？'))return;data=parsed;persist();location.reload()}catch(err){alert('読み込み失敗：'+err.message)}finally{e.target.value=''}};$('reset').onclick=()=>{if(confirm('参加者と入力内容をすべて削除しますか？')){localStorage.removeItem(KEY);location.reload()}};peopleRender();draw()})();
</script></body></html>
